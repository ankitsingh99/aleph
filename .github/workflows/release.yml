# Release on v* tags: macOS on Apple silicon, as a plain build and a showcase
# one. This is the self-update contract (`aleph self-update` reads it):
#   aleph-<target>.tar.gz   the `aleph` binary at the archive root
#   aleph-showcase-<target>.tar.gz   the same with showcase mode built in
#   SHA256SUMS                     `<sha256>  <asset>` lines (sha256sum format)
#   SHA256SUMS.minisig             its minisign signature (when the repo has MINISIGN_SECRET_KEY)
# plus aleph.rb, the Homebrew formula rendered from SHA256SUMS.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "existing tag to (re)build, e.g. v1.0.0"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    name: build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: version matches the tag
        shell: bash
        run: |
          v=$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -n 1)
          [ "v$v" = "$TAG" ] || { echo "error: Cargo.toml version $v doesn't match tag $TAG" >&2; exit 1; }
      - name: build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: package
        shell: bash
        run: |
          set -euo pipefail
          bin=target/${{ matrix.target }}/release/aleph
          file "$bin" || true
          mkdir -p dist
          # no AppleDouble ._ files from macOS tar: the binary is the only entry
          export COPYFILE_DISABLE=1
          tar -C "$(dirname "$bin")" -czf "dist/aleph-${{ matrix.target }}.tar.gz" aleph
          tar -tzf "dist/aleph-${{ matrix.target }}.tar.gz"
          # 1.x (claude-herdr) self-update looks for this name with this binary
          # at the root: same build, old name; its first run moves things over
          compat=$(mktemp -d); cp "$bin" "$compat/claude-herdr"
          tar -C "$compat" -czf "dist/claude-herdr-${{ matrix.target }}.tar.gz" claude-herdr
      - name: run it (native targets)
        if: matrix.target != 'x86_64-apple-darwin'
        run: target/${{ matrix.target }}/release/aleph help </dev/null | head -n 5
      - name: no showcase in the plain build
        run: tools/showcase-strings.sh target/${{ matrix.target }}/release/aleph
      - name: showcase build
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --locked --target ${{ matrix.target }} --features showcase
          export COPYFILE_DISABLE=1
          tar -C target/${{ matrix.target }}/release -czf "dist/aleph-showcase-${{ matrix.target }}.tar.gz" aleph
          tar -tzf "dist/aleph-showcase-${{ matrix.target }}.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: aleph-${{ matrix.target }}
          path: |
            dist/aleph-${{ matrix.target }}.tar.gz
            dist/aleph-showcase-${{ matrix.target }}.tar.gz
            dist/claude-herdr-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  publish:
    name: publish ${{ inputs.tag || github.ref_name }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: aleph-*
          merge-multiple: true
      - name: SHA256SUMS + Homebrew formula
        run: |
          set -eu
          cd dist
          sha256sum aleph-*.tar.gz claude-herdr-*.tar.gz > SHA256SUMS
          cat SHA256SUMS
          cd ..
          # the formula wants every target: with macOS arm alone, none
          if packaging/homebrew/render.sh --version "${TAG#v}" --repo "$GITHUB_REPOSITORY" \
            dist/SHA256SUMS > dist/aleph.rb 2>/dev/null; then
            ruby -c dist/aleph.rb
          else
            rm -f dist/aleph.rb
            echo "no Homebrew formula this time: it needs every target"
          fi
      # one signature covers every archive (they're all in SHA256SUMS); a repo
      # without the secret publishes unsigned releases, as before
      - name: sign SHA256SUMS (minisign, when MINISIGN_SECRET_KEY is set)
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          set -eu
          if [ -z "${MINISIGN_SECRET_KEY:-}" ]; then
            echo "no MINISIGN_SECRET_KEY: this release is unsigned"
            exit 0
          fi
          sudo apt-get install -y minisign >/dev/null
          key="$RUNNER_TEMP/aleph-minisign.key"
          umask 077
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$key"
          minisign -S -s "$key" -m dist/SHA256SUMS -t "aleph $TAG SHA256SUMS"
          rm -f "$key"
          cat dist/SHA256SUMS.minisig
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          notes=$(awk -v v="## ${TAG#v}" 'index($0, v) == 1 {f=1; next} /^## /{f=0} f' CHANGELOG.md || true)
          [ -n "$notes" ] || notes="aleph $TAG"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "aleph $TAG" --notes "$notes" --verify-tag
          fi
