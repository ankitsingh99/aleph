[[entry]]
id = "2026-10-25-h"
date = "2026-10-25"
title = "Installs that finish on a fresh Linux machine"
notes = [
  "A long, quiet install is left to finish: Hermes's clone runs to the end. Setup stops an installer only when it sits at a question it can't answer (a minute), or after 30 minutes in all.",
  "What agents need on a bare Linux machine goes on first: uv for Kimi, the build tools for Letta (make, a C++ compiler, Python); cloudflared comes from Cloudflare's own download (it isn't in apt).",
  "A failed install says the installer's own error, not Aleph's note about it.",
  "Moving around the install list while agents install no longer stops Aleph (\"Stopped aleph\" in the shell).",
  "After the installs, setup tidies up: npm's and uv's caches, build headers, broken links a failed install left behind — and says how much it freed. Installers run in a scratch folder, so nothing lands in the folder you started setup from.",
]
commits = [
  "The dashboard is never stopped by a child writing to the terminal: \"[2]+ Stopped aleph\" while setup installed agents was SIGTTOU (an installer touching the tty's modes from the background) — SIGTTOU and SIGTTIN are ignored while Aleph has the screen, and put back on every hand-off",
  "Installs that finish on a fresh Linux machine, then a tidy-up",
  "Agent installers run in a scratch folder of their own, removed afterwards even when stopped: Crush's installer downloads into the folder it's run from and left archive-XXXXXX folders (one a half download) wherever setup was started",
