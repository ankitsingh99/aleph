# What's new: one entry per release, newest first. Built into aleph: the
# dashboard shows the entries newer than the last one you saw (ui.whats_new),
# and `aleph whats-new` prints them.
#
# `notes` are in plain words, for the card; `commits` (optional) are shown
# under "more". tools/whats-new.sh starts an entry from the commits since this
# file last changed, split between it and the showcase one.
#
# Notes about showcase mode go in whats-new-showcase.toml under the same id:
# only a build with that feature carries them.

[[entry]]
id = "2.0.1"
date = "2026-10-27"
title = "Remote machines watched for real; Codex, Antigravity and OpenCode 2 in full"
notes = [
  "Pausing a machine (Z in Fleet) asks for a second Z, and a paused machine says so everywhere; a question on it is never filed away as answered.",
  "Codex, Antigravity CLI and OpenCode 2 sessions show their tokens, cost, turns and timeline, each request with the model it ran on.",
  "Aleph installs OpenCode 2 and marks it supported; OpenCode 1 gets a warning, with the command to move up. Installing an agent from the dashboard runs inside Aleph, and a fresh agent gets its herdr integration.",
  "Free models count their tokens and say free. Gemini 3 is priced from Google's list; with an OpenRouter key, OpenRouter's prices cover paid models. openrouter.models picks all, free or paid only, for the model picker and OpenCode.",
  "The model in use shows in Fleet, Focus and on the timeline; v folds the timeline by session or by prompt, each line with its steps.",
  "ctrl+a opens the approval board while you type into an agent; in Usage, b drives the charts.",
  "Notifications fall back to macOS's own when terminal-notifier may not notify; install.sh puts aleph on your PATH.",
]
commits = [
  "Fleet: pausing a machine asks twice, shows everywhere, and follows the settings",
  "Usage: Codex, Antigravity CLI and OpenCode 2 read in full; free models; Gemini 3 and OpenRouter prices",
  "Agents: OpenCode 2 installed and supported; installs inside Aleph; integrations for fresh agents",
  "Dashboard: the model in use, timeline folding by session or prompt, b drives Usage's charts",
  "OpenRouter: all, free or paid models, in the picker and OpenCode's config",
  "Focus: ctrl+a opens the approval board while typing, when something waits",
  "Notifications: osascript when terminal-notifier may not notify; install.sh: aleph on your PATH",
]

[[entry]]
id = "2.0.0"
date = "2026-10-26"
title = "Aleph 2.0: native agent panes, approvals, usage by account and project, every agent's timeline"
notes = [
  "Focus types straight into the agent, like its own terminal: every key and chord goes to it (ctrl+enter too, where the terminal reports it), a paste arrives as one paste, the wheel scrolls its whole history. ctrl+], ctrl+q or a click outside gives the keys back to Aleph; the first esc is held back (esc stops most agents' work) until you press it again.",
  "The approval board (ctrl+a, from any view): every agent waiting on you, its question exactly as it shows it, as a list or cards. y approves, n denies, 1–9 picks any option, space marks several, Y approves every clear yes; enter answers it in Focus. Each answer is checked against a fresh read first, and a question answered anywhere leaves at once, its Inbox item with it.",
  "Usage knows whose account each request was on (two Claude or Codex logins, on one machine or several) and which project: one repo wherever you worked on it. Filters combine — any period or your own dates, agents with their accounts, machines, projects — over tabs (Overview, Breakdown, Trends, Turns & sessions, Insights), one long page or a pivot.",
  "What every agent did, as a tree: each conversation's prompts, turns, tool calls and subagents with time, tokens and cost, repeats folded. G in Fleet shows it in the right panel, Focus at its side, Monitor › Timeline for earlier conversations by project.",
  "Fleet maximised (z) lays each machine across the screen: CPU, memory and GPUs as meters and sparklines, network, disks, today's usage, who uses the GPUs, and its sessions under it with their state, this turn, model, folder and branch and the agent's latest output.",
  "A quieter Inbox: a machine that stops answering is filed only when an agent there was at work, after 30 seconds (inbox.down_grace), and closes itself when it's back with nothing lost. Finished turns stay out unless you ask (inbox.finished). Desktop notifications skip what you're already looking at.",
  "No internet but your machines still answer: the header says so, and prompts to them go now instead of into the queue.",
  "Light themes redone (cards, popups with a shadow, every colour readable), calmer screens (no flicker, ambience kept off agents' screens), the palette (ctrl+k) while typing into an agent, a Mac's GPU in the stats.",
  "Moshi is off until you turn it on (aleph moshi install).",
  "Raycast: Usage with every period, account and project, cost breakup, trends and insights; a new Timeline command.",
]

[[entry]]
id = "2026-10-25"
date = "2026-10-25"
title = "Setup that installs for you, OpenRouter, limits for every agent"
notes = [
  "Setup collects everything a computer is missing — herdr, a Nerd Font, terminal-notifier, an ssh key, your agents and their herdr integrations, the daemon — and installs it at the end on its own screen: agents side by side with their own output and progress, a retry for anything that failed, an install log, a celebration when it's done.",
  "⚡ Quick start: in setup's first step or aleph setup --defaults installs what this computer is missing with no questions. ./install.sh --defaults also installs Rust and herdr on a new computer.",
  "Installs that finish: long, quiet installers run to the end (up to an hour, agents.install_timeout; x stops one), what an installer needs goes on first on a bare Linux machine, and a failed one says the installer's own error. Afterwards setup tidies caches and leftovers and says what it freed.",
  "Every agent Aleph knows has an install command, from its official installer.",
  "OpenRouter: give Aleph your key once (kept in the Keychain), and OpenCode, Kilo, Pi, OMP, Crush, Hermes and Maki sessions get it through herdr's socket — never on a command line, on disk or in a log. Pick any OpenRouter model when starting one; its spend and credits show in Usage and the header.",
  "Usage limits are recognised for every agent, in each one's own words; warnings and fallback models no longer count as stopped. After a limit, pick which agents carry on by themselves.",
  "ssh keys: setup finds every key in ~/.ssh and asks which one Aleph uses; machines already saved in herdr are recognised again.",
  "Splashes redrawn (Singularity, Pulsar), ui.splash = random really random, the theme gallery shows each theme once with its light version on space, Cyberpunk light redone for daylight.",
  "ctrl+k opens Monitor's pages and each machine's own (GPU, CPU, memory, processes, network).",
]

[[entry]]
id = "2026-10-24"
date = "2026-10-24"
title = "Themes with a personality, splashes, profiles, workspaces, hand-offs and races"
notes = [
  "Themes go beyond colour: each has its own frames, spinner, state glyphs, a living detail in the header and its own splash. New: Cyberpunk, and the cosmos — Singularity, Pulsar, Event Horizon, Matrix, Matrix mono, Convergence — each with a light version. The theme gallery repaints the dashboard as you move; your own theme is a [themes.NAME] table.",
  "Splashes: singularity, pulsar, event-horizon and Cyberpunk's cyberdeck and neon, in a gallery with live previews; ui.splash_ms sets how long one plays, aleph splash NAME plays one on its own.",
  "Settings profiles (aleph profile use demo, travel, work or your own), saved workspaces (W), backups that never hold a secret (aleph backup), and aleph:// links that ask before they act.",
  "The prompt library (ctrl+p, @name), hand-offs to another agent with a note (h), and race mode: one prompt to several agents, each in its own worktree, their diffs side by side.",
  "Session timelines (g in Fleet, Monitor › Timeline), row bars with tokens a minute and context, light motion, cost per turn in every alert, and a daily session journal (aleph journal).",
  "Multi-select with an action bar, closes you can undo for 5 seconds, the GPU's owner session, o opens a session's folder in your editor.",
  "Agents outside herdr: aleph outside ls as a table; x stops one, enter reopens it inside herdr in the same folder and conversation.",
  "This card: what changed since you last opened Aleph (ui.whats_new = off turns it off; aleph whats-new shows it again).",
]
