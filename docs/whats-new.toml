[[entry]]
id = "2026-10-26-a"
date = "2026-10-26"
title = "Native agent panes, an approval board, light themes that read"
notes = [
  "Focus types straight into the agent, like its own terminal: every key goes to it (ctrl+c interrupts it), a paste arrives as one paste. ctrl+], ctrl+q or a click outside gives the keys back to Aleph. focus.keys = aleph brings back the old way; enter_opens = attach opens herdr's own view instead.",
  "The mouse wheel scrolls an agent's pane in Focus and Tile through its whole history (herdr's), or scrolls the agent itself when it takes the mouse; a badge says how far back. Clicks go to agents that take them.",
  "ctrl+a, from any view: the approval board. Every agent waiting on you, its question exactly as it shows it, beside the list (or as cards: v). y approves, n denies, 1–9 picks any option (menus of 5–6 options too), Y approves every clear yes at once, enter opens it. It updates live, and a question answered elsewhere is marked and leaves. Before anything is sent the question is read again: if it changed, nothing goes; if it's on your deny list, it's yours to answer at the terminal.",
  "Light themes, redone: near-white paper in each theme's colour, panels as cards, popups that float with a shadow, a selection you can see, and every colour readable (text 12:1, states 4.5:1).",
  "Starting a session (n): / searches the agents, the ones the machine has first. More options' agent field searches as you type.",
  "Shell panes work: opening one, sending it a message or keys, attaching to it (it said \"agent target … not found\" before).",
  "A Mac's GPU shows in the stats (no sudo): its use, the memory it shares, renderer and tiler, its cores.",
  "ctrl+k: \"usage b31\" or \"usage claude\" opens Usage for that machine or agent; x shows everything again.",
  "Fleet: OpenCode's preview fits the panel instead of wrapping into pieces; x close shows in the footer. Cyberpunk has no falling rain.",
]
commits = [
  "Shell panes open, take messages and keys; Cyberpunk without its rain",
  "Focus types straight into the agent; the wheel scrolls a pane's history",
  "Search the agents when starting a session, the machine's own first",
  "Showcase test: Focus opens typing, ctrl+q before Aleph's keys",
  "The approval board: every waiting agent's question, answered from one place",
  "ctrl+k: usage for one machine or one agent",
  "The waiting chip gives way: to the tab row's key hint, and to showcase's tagline",
  "Light themes redone: paper, cards, popups that float, inks that read",
  "A Mac's GPU in the stats, without sudo",
]

[[entry]]
