  "redistributable: tools/package.sh zips a clean git repository of the branch (its history, no remote, no build output or installed dependencies); install.sh --showcase builds showcase mode in, --raycast builds the Raycast extension; README: installing on a new computer from the zip, themes and splashes; CLAUDE.md: look.rs and tui/ambience.rs, every theme in the gallery's row; the two screenshots dropped at the top no longer tracked",
