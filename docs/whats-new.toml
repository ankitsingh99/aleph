  "splash convergence: many minds becoming one — a network waking across the screen, your machines its hubs (named), their sessions satellites round them in their states' colours, signals running along its edges; it learns: activity spreading out from the hubs, new nodes and edges appearing, attention arcs leaping between distant nodes in magenta, the pulses ever faster (closed form); then it converges, everything spiralling in (trails show the arms), hotter and denser, until it collapses into one brilliant core, spikes thrown out, and a ring of light goes out, gold, magenta, cyan; it ends on the core quietly thinking, slow rings and a few thoughts turning round it on threads; with the logo the core unfolds into the ℵ, held as a constellation with signals running along its strokes. Every splash is built now",
  "splash matrix, convergence: tested with no fleet, one machine and a dozen with long names, on the smallest screen and the largest",
  "splash convergence: the core sized to the screen (larger on a tall one, its slow rings too), and kept above the wordmark on a small one",
  "light themes, again: mid-tone grounds (no glare; each its own tint, Cyberpunk a deeper gold) and inks held higher on them (text 9:1, muted 6:1, faint 4.5:1, every colour 5:1, lines 2.2:1); colours are fitted toward whichever of black or white stands out more (a mid-tone paper counted as dark, so inks were lightened), and a target out of reach goes as far as it can instead of staying put; splashes keep the background they draw on (the splash gallery's previews had a dark block under every glyph); aleph splash theme plays the theme's own",
