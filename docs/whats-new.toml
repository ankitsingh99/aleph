  "Typing into an agent, the first esc is held back: esc stops most agents' work. A toast and the status bar say so; press esc again within 3 seconds to send it (esc esc still works for Claude Code). ctrl+] or a click outside the pane gives the keys back to Aleph. focus.esc_guard = off turns this off.",
  "ctrl+k opens the palette while you type into an agent too. In Fleet its first entry is Focus on the selected session; in Focus it offers Leave Focus and Keys back to Aleph.",
  "The doctor no longer checks this computer (local) as if it were an ssh machine, so its DNS and ssh failures are gone.",
  "Secret values (the OpenRouter key) never appear on a command line or on screen.",
  "Raycast's Usage opens again after an update instead of crashing on its saved menu choices.",
]
