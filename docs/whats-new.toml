# What's new: one entry per deploy, newest first. Built into aleph: the dashboard
# shows the entries newer than the last one you saw (ui.whats_new), and
# `aleph whats-new` prints them.
#
# `notes` are in plain words, for the card. `commits` are that deploy's commit
# subjects (shown under "more"). tools/whats-new.sh starts an entry: the
# commits since this file last changed, split between it and the showcase one.
#
# Notes about showcase mode go in whats-new-showcase.toml under the same id:
# only a build with that feature carries them.

[[entry]]
id = "2026-10-26-f"
date = "2026-10-26"
title = "A quieter Inbox: outages that matter, finished turns your way"
notes = [
  "A machine that stops answering reaches the Inbox only after 30 seconds (inbox.down_grace) and only if an agent there was working or waiting on you — saying which and for how long. A quiet machine dropping, or this computer itself being offline, files nothing; what's gone is told once it's back. ssh's exit 255 now reads as \"unreachable — ssh couldn't connect\".",
  "When it answers again, its outage row gets its end and what happened to the sessions there, and archives itself when nothing was lost (inbox.machine_back = close; lost says only what's gone; off says nothing). Drops of one machine on one day are one row.",
  "Finished turns stay out of the Inbox by default (inbox.finished = none); unseen, unseen-long or all bring them back, one row a session a day.",
  "Desktop notifications: questions, limits, problems with agents and long finished turns — never about a session on screen in a dashboard you're looking at (Aleph now hears when its terminal gains or loses focus). notify_done sends every finished turn.",
  "Your old machine-down, back-up and finished items were archived once (A shows them; nothing deleted).",
  "install.sh pulls the newest source first (a fast-forward; offline or with local changes it just builds what's there; --no-pull skips it).",
]
commits = [
  "install.sh: pull the newest source first, optionally",
  "Inbox and notifications: outages that matter, finished turns your way",
]

