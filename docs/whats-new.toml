date = "2026-10-25"
title = "Hermes installs faster and finishes"
notes = [
  "Hermes installs without its built-in browser and computer-use driver — hundreds of MB less to download. Add them any time with: hermes pm install agent-browser cua-driver.",
  "A slow agent install is no longer cut off at 15 minutes: installs may run up to an hour (agents.install_timeout), and x on the install screen stops one yourself; i runs it again.",
  "A failed install now says what actually went wrong (the installer's error), not \"left a note for Aleph\".",
]
commits = [
  "Raycast README: the deep-link example's machine is b31 (a real machine's name was left URL-encoded)",
  "package.sh: the new repository's commit starts no background gc, which packed its objects while zip read them (and broke the clean-up)",
  "Hermes installs without its browser and computer-use driver (--skip-browser --skip-computer-use, --non-interactive): hundreds of MB less on top of the clone and the ffmpeg it always fetches; `hermes pm install agent-browser cua-driver` adds them later. A `curl … | bash -s -- --flag` install line is a script install (plain --flags only)",
  "Agent installs: one limit, x to stop one, the real reason",
]

