  "Raycast Usage: survive the dropdown choices an older build cached",
  "Doctor: local is this computer, never an ssh machine",
  "Ambience: never on an agent's screen; stars fade, frames land whole",
  "Focus: the first esc into an agent is held back; ctrl+k opens the palette",
