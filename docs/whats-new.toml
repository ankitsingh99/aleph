  "Usage knows whose account each request was on: two Claude logins, or two ChatGPT/Codex ones, on one machine or several, each with its own cost under the total (aleph usage accounts). Name them as you like: by email and plan, plan and id, or a nickname. Older records get a best guess, marked ≈.",
  "A project is now one repo wherever you worked on it: the same git remote on two machines is one project, worktrees and subfolders fold into their repo (aleph usage projects).",
  "Usage's filters combine: any period (the last 24 hours, 3, 7 or 30 days, 6 months, today, this week or month, all time, or your own dates on a calendar), agents with their accounts, machines and projects. Pick them from the chip bar (t a m p), click a chip's × to drop it, or type them (/).",
  "Usage has tabs now — Overview, Breakdown, Trends, Turns & sessions, Insights — or one long page, or a pivot (L switches). The cost breaks up under the total by account, agent, machine, model or project; this period is drawn against the one before; the week's hours and the last 12 weeks as heatmaps; what a prompt and a session cost, the costliest prompts, plan value, the tools.",
  "What every agent did, as a tree: each conversation's prompts (who sent them), turns, tool calls and subagents, with time, tokens and cost. G in Fleet shows it in the right panel, Focus shows it at the side, and Monitor › Timeline lists earlier conversations by project with the selected one's tree beside it. Repeats fold (\"Read + 7 more\"), finished prompts close to a line; the wheel scrolls it, a click opens or folds a row, w shows the words (read live, never kept). aleph timeline prints it.",
  "Focus: scrolling an agent with the wheel holds still instead of flickering, and ctrl+q leaves Focus (esc goes to the agent).",
  "Raycast: Usage takes every period and your own dates, one account or project, and gains Cost breakup & trends and Insights; a new Aleph Timeline command opens any conversation's tree.",
]
