[[entry]]
id = "2026-10-24-g"
date = "2026-10-24"
title = "Multi-select, undo close, GPU owner"
notes = [
  "Mark sessions with space, then act on all of them: y approves every one that's asking (with each question's own yes; the rest are skipped and the toast says why), s sends one prompt, Q queues a task for each, x closes them. The hint line turns into an action bar while anything is marked.",
  "Closing a session can be undone: it waits 5 seconds first (close.grace) while the agent keeps running, the row greys out, and u keeps it. The same grace holds from Raycast (Undo, ⌘Z), the web console (an Undo button) and the shell (aleph close --undo; --now closes at once).",
  "GPU owner: Monitor's GPU table names the session each GPU process came from (◆ session), and the Fleet preview shows a session's GPU job.",
]
commits = [
  "undo close: a close waits close.grace (5s; 0 = at once) while the agent keeps running, wherever it's asked — the dashboard greys the row \"closing in 5s · u undo\" and u keeps it (the selected one, else the last close; from any view while its toast says so; the palette too); aleph close prints how to undo (--undo [name], --now, --pending, --json); session.close answers {pending, deadline} (now: true at once) and session.close.undo keeps it",
  "multi-select: with sessions marked (space), y approves every one that asks with its question's own yes option (those not asking, on approve_deny or without a clear yes are skipped, and the toast says how many and why), s sends one prompt to all (what b does with marks), Q queues the task for each (sent once it's free; tab in the send form too), x closes them all (after close.grace); an action bar replaces \"◉ N marked\": ◉ 3 marked · y approve · s send · Q queue · x close · esc clear",
  "raycast: Close waits Aleph's grace — its toast counts it (\"Closing ignite in 5s · the agent runs until then\") with an Undo action (⌘Z) that calls session.close.undo; without a daemon the CLI waits the grace itself (close --yes --json), and the Undo is there from the first moment (close --undo)",
  "web console: Close… on a session's page (control scope, remote control on for it) asks, then waits Aleph's grace with a snackbar that counts down — \"Closing ignite on b31 in 5s — the agent runs until then\" — and an Undo button (session.close.undo)",
  "close confirms say the grace everywhere (Inbox X, Focus X, a machine's checklist): \"the pane closes in 5s (the agent runs until then; u keeps it)\"",
]

[[entry]]
id = "2026-10-24-f"
date = "2026-10-24"
title = "Timelines, motion and alerts"
notes = [
  "Session timelines: g in Fleet turns each session row into a chart of its last hours (working, needs you, done, idle, at limit) under an hour axis, and Monitor › Timeline (t) shows every session by machine, ended ones too, with busy time and questions. The preview and Focus get a one-line strip. ui.timeline_hours sets how far back.",
  "Row bars: each Fleet session row shows tokens a minute over the last half hour and how full its context window is (ui.row_bars).",
  "Light motion, for everyone: a session that needs you breathes softly, and one that just finished shows ✓ finished for a moment. Only the text's colour moves (ui.motion = on, reduced, off).",
  "ctrl+n, in any view: the alerts you missed since you last opened the Inbox, and the last 20 toasts. Enter goes to the session, r marks them read.",
  "o on a session opens its folder in your editor (Cursor, VS Code or Zed; another machine's over Remote-SSH). The editor setting picks it, and aleph edit does it from the shell.",
]
commits = [
  "light motion for every build, on by default (ui.motion = on / reduced / off): a Fleet row that needs you breathes softly, a session that just finished gets a tick (✓ finished, a band of light crossing it) for a moment; only the text's colour moves, never a background; reduced keeps the tick, NO_COLOR has none",
  "open in editor: o in Fleet (or aleph edit) opens a session's folder in Cursor, VS Code, Zed or your own command — another machine's over Remote-SSH (Zed: ssh://); the editor setting picks it",
  "session timelines: each session's states over the last hours (ui.timeline_hours, 6) — Fleet's rows with g (fleet.timeline) under an hour axis, the preview's strip, Monitor › Timeline (t: every session by machine, ended ones too, busy time and questions; + - hours, e ended, enter Focus), Focus's timeline; the hub writes the state log (states.tsv, 48 h, capped; one writer)",
  "row bars: tokens a minute over the last half hour and the context window's fill, as a tiny sparkline and meter after each Fleet session's status (ui.row_bars = tokens,context / off); from the session's own logs (usage records' per-request tokens, kept as Live::recent); blank room without numbers, left out below a 96-column list, giving way to the timeline when it's tight",
  "alerts: ctrl+n in every view (key.alerts) shows the alerts you missed — Inbox events since you last opened the Inbox — and the last 20 toasts with their times and levels (marked when they showed in Focus or Tile); enter goes to the session's row (or the Inbox), r marks them read, i the Inbox; in the help search and the palette",
  "timelines: a paused machine's sessions aren't counted as seen (their stretches wait); a test pins the rows' lead to the width the axis assumes",
]

[[entry]]
id = "2026-10-24-e"
date = "2026-10-24"
title = "Prompts, hand-offs and races"
notes = [
  "The prompt library: ctrl+p in the send box and the queue lists your saved prompts; @name and enter does the same, and @name works as a new session's first prompt too. {folder}, {host}, {task} and friends fill themselves in from the session, anything else is asked. ctrl+s saves what you've written as a new one. From the shell: aleph send b31:hunt @review, aleph prompt ls.",
  "Hand-offs: h on a session hands its work to another agent. The agent writes a hand-off note first (or Aleph builds one from git and its screen, when it's at its limit or handoff.summary = aleph), then the new agent starts in the same folder with it. The old session stays. aleph handoff b31:hunt --to codex from the shell.",
  "Race mode: ctrl+k › Start a race… sends one prompt to Claude Code and Codex (race.agents, up to 4) at once, each in a git worktree of its own, and Race <id> shows their diffs side by side as they work. aleph race \"…\", race ls, race show.",
]
commits = [
  "the prompt library: saved prompts with {variables} (the session's dir, folder, host, agent, task filled in; the rest asked), ctrl+p or @name in the send box, the queue and a new session's prompt, ctrl+s saves what you wrote; aleph prompt; aleph send x @name --var k=v, aleph new -m @name",
  "hand-offs: h in Fleet (or aleph handoff) hands a session's work to another agent — its own hand-off note (or Aleph's from git and its screen, as handoff.summary says, and when it's at its limit or silent), then a new session in the same folder with it",
  "race mode: one prompt to 2–4 agents at once, each in a git worktree of its own from the same base commit; the dashboard's race view shows their diffs side by side, refreshed while open; aleph race, race ls, race show",
]

[[entry]]
id = "2026-10-24-d"
date = "2026-10-24"
title = "Workspaces and the theme gallery"
notes = [
  "Saved workspaces: W shows them, and enter (or 1–9) takes you there: a tab and Monitor's sub-view, its layout, Fleet's filter and a machine, all at once. Press s in it to save where you are now, d twice to delete one. GPU watch, Standup and Sessions only are there to start with; aleph ui NAME opens one from the shell.",
  "The theme gallery (ctrl+k › Theme gallery, or enter on Settings' theme or accent): Graphite, Paper, Nord, Catppuccin Mocha and Latte, Tokyo Night, Gruvbox, Dracula and Solarized Light beside the accents, and the whole dashboard repaints as you move. Enter keeps it, esc puts back what you had.",
  "Your own theme: a [themes.NAME] table in aleph.toml (base = a theme to start from, then any colour as #rrggbb), then theme = NAME. It's in the gallery too.",
]
commits = [
  "saved workspaces: W goes to a named place in the dashboard (a tab and Monitor's sub-view, its layout, Fleet's filter, a machine) or saves where you are; starters gpu-watch, standup, sessions; the palette, aleph ui NAME, aleph://open?workspace=",
  "the theme gallery: nine themes (Graphite, Paper, Nord, Catppuccin Mocha and Latte, Tokyo Night, Gruvbox, Dracula, Solarized Light) and your own ([themes.<name>] in aleph.toml) beside the accents, repainting the dashboard live as you move; enter keeps, esc puts back",
]

[[entry]]
id = "2026-10-24-c"
date = "2026-10-24"
title = "Settings profiles"
notes = [
  "aleph profile use demo, travel or work switches a whole set of settings at once, over your own; aleph profile off brings yours back. Your aleph.toml is never touched: a profile is its own file (profiles/NAME.toml), and the starters are written out the first time you use them, for you to change.",
  "Make your own: aleph profile save NAME KEY… keeps settings as they are now, aleph profile set NAME KEY VALUE changes one, aleph profile show NAME compares it with yours.",
  "The dashboard shows the profile in use as a ◆ chip in the header, and the palette (ctrl+k) switches profiles.",
  "The daemon and every dashboard now pick up settings changes within seconds, without a restart.",
]
commits = [
  "aleph profile: whole sets of settings at once (demo, travel, work, your own), layered over yours for every process; off brings yours back. The daemon and dashboards read the settings again when they change (Config::stamp); a header chip and palette entries",
  "the daemon says which step holds its loop up",
]

[[entry]]
id = "2026-10-24-b"
date = "2026-10-24"
title = "Backups, aleph:// links, and this card"
notes = [
  "aleph backup puts your settings, presets, history, notes and session memory in one file, and never a secret. aleph backup restore FILE shows each file and setting it changes, asks, and saves what it replaces first.",
  "aleph:// links open a view or a session from Shortcuts, Stream Deck or a note (aleph://open?view=monitor, aleph://focus?session=b31:hunt). Links that start, send, approve, close or queue always ask first in a dialog; approve shows the session's screen. aleph url install sets them up, aleph url links lists them.",
  "aleph ui monitor (or inbox, settings) opens the dashboard on that tab.",
  "Layout mode (L): 1–4 maximise a panel instead of switching tabs; q and esc leave layout mode without quitting.",
  "aleph settings shows long setting names in full.",
  "This card: what changed since you last opened Aleph. ui.whats_new = off turns it off; aleph whats-new shows it again.",
]
commits = [
  "aleph backup: settings, history, notes and session memory in one file, never a secret; restore shows what changes, asks, keeps this computer's secrets and saves what it replaces",
  "aleph:// links: open a view or a session in a new tab; new, send, approve, close and queue confirm with a dialog every time (approve shows the screen); aleph url install registers an osacompile applet (or a .desktop file) carrying the daemon's PATH; aleph ui <view>",
  "What's new: a card after an update with what changed (curated notes, commit subjects under more); aleph whats-new",
  "layout mode takes its own keys first: 1–4 maximise (not the views), q and esc leave it (not the dashboard, not the view)",
  "settings list: whole keys, a gap after each column",
]
