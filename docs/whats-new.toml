[[entry]]
id = "2026-10-25-d"
date = "2026-10-25"
title = "Splashes redrawn, limits for every agent, palette pages, themes in showcase"
notes = [
  "Singularity and Pulsar redrawn as light. Singularity: a violet void breathing into a white-hot point, an eruption that fills the screen and cools into a cosmic web, galaxies forming at its knots — your machines the big ones. Pulsar: a neutron star in a Crab-like nebula, its beams sweeping a cone, a magnetar flare with a magenta shockwave, spinning up to a millisecond disc. The trace along the bottom is gone. Try aleph splash singularity --loop.",
  "Usage limits are recognised for every agent Aleph runs — Gemini CLI, Antigravity, Copilot, Cursor, Qwen, Kimi, Amp, Droid, OpenCode, Cline and more, in each one's own words — and warnings, cooldowns and 'switched to a fallback model' no longer count as stopped.",
  "ctrl+k opens Monitor's pages (type usage, timeline, services…) and each machine's own: type a machine's name and its GPU, CPU, memory, processes and network pages are right there.",
  "Setup's ssh-agent row only asks about keys that have a passphrase, and loads each one with a press.",
  "A setting your settings profile sets is now changed in that profile, so the change sticks (it used to go to aleph.toml, where the profile hid it).",
]
commits = [
  "ssh-agent in setup: each key is asked whether it has a passphrase (ssh-keygen -y -P '', local, changes nothing); only those need the agent — they're offered inline, one 'load <key>' each, straight to ssh-add's own prompt with that key (a bare ssh-add only knew id_* names and failed); no passphrase anywhere: the row is fine",
  "splash singularity: an emerging universe, drawn as light — the void a violet haze breathing and swirling in, foam falling to a white-hot point in a glow of gold and rose with diffraction spikes, a ring of the void closing on it with each quickening beat; its breath in, a flash, a fireball swelling past the screen's edges, billowing (lobes lit from inside) and filamented, cooling from white through gold and rose to violet behind its shock front, sparks thrown ahead; its afterglow draining into the cosmic web, wavering threads condensing between knots, its brightest lobes becoming nebulae with wisps and dark lanes; galaxies forming at the knots as log-spiral arms winding up and turning (some edge-on with a dust lane), your machines the big ones, named; the first stars in their classes' colours; the view pushing slowly in at the end. light.rs: an additive raster the cosmos scenes add light into — fine light at braille-dot resolution (points, splats, halos, rays, fields), gas a cell apiece drawn as a stipple where thin and in dots where dense, tone-mapped so bright light whitens; interleaved-gradient-noise dither (even tones, no lattice); value noise, fbm and ridges",
  "splash light: hues kept, whitening only the brightest light (a hot core, not every bright line), the faintest gas in dots rather than a wall of stipple, the stipple's brightness held; singularity: your machines' galaxies kept whole on screen as the view pushes in, its nebulae a little softer; the gallery says what it shows now (a point in the foam, its fireball, the cosmic web, nebulae and spiral galaxies)",
  "splash pulsar: a neutron star's lighthouse, drawn as light, the bottom trace and its readouts gone — it switches on in a flash, a ring of light thrown out; a blazing blue-white core with six diffraction spikes; its magnetosphere's dipole loops drawn out round it, turning with its magnetic axis (tilted from its spin axis, in 3D: the beams sweep a cone), an equatorial torus with wisps rippling out, faint jets with knots along the spin axis, all inside a wind nebula like the Crab's (a blue synchrotron haze clear round the star, a cage of rose, coral and amber filaments); two beams, white-hot cores in cones of cyan widening as they go, a trail behind each, sweeping a deep field of stars and lighting the stars they cross; once a turn one sweeps across you and the sky pulses white; the magnetar flare: a loop brightening magenta, thrown out twisting, sparks racing along the field lines, a shockwave ringing out that lights the filaments as it passes, the glitch; spun up to a millisecond pulsar its beams blur into a luminous disc in its equatorial plane, ripples of light running out across it, the torus blazing; it settles to a calm sweep. Your machines are stars the beams light, named for a while after. With the logo, the ℵ held with the beam sweeping on over it. Tests: a beam crosses you once a turn, a beam brighter along it than across, the disc spun up, the flare's magenta shockwave, nothing on the rows above the console at any size",
  "splash pulsar: the flare reads — its shockwave a bright magenta ring three strands deep with only a thin glow behind it, the flash a moment shorter, the haze lit less after it; the sweep sampled finely only while its beams are distinct (a little quicker spun up)",
  "limits: every harness in its own words — Claude Code, Codex, Gemini CLI (its dialog, errors and footer), Antigravity, Copilot, Cursor, Qwen, Kimi, Amp, Droid, OpenCode/Kilo, Cline, Hermes, Letta, Pi, Qoder, Command Code (read from their source or issues, 2026-10-25); never a warning, a cooldown or a notice that the agent carried on (fast limit, 85% used, switched to a fallback or auto, retry banners, high demand); more resets (reset in/after/on, retry in, refreshes in, cycle ends on), the reset cut before 'or'",
  "e2e: the fake world drops HERDR_* — run from inside a herdr pane, the wrapper handed every call to the agent (the wraps check) and herdr calls could reach the real server; a smoke check for a setting the profile names",
  "the palette opens Monitor's pages (usage, timeline, services, …) and each machine's own (b31 › GPU, Processes, …): typing a machine's name lists them",
  "preflight: no needless return (clippy)",
  "sshcfg: formatting",
]

[[entry]]
id = "2026-10-25-c"
date = "2026-10-25"
title = "Your ssh keys, saved machines, saving without the terminal"
notes = [
  "Setup finds every ssh key in ~/.ssh, whatever it's called, and asks which one Aleph uses (or makes a new one when you apply, never over a key you have). Key setup copies that key, and tells ssh to offer it to the machine.",
  "Machines already saved in herdr are recognised again (herdr 0.9.5 changed how it lists them), so setup no longer queues them to be saved twice — and a save that finds the machine there already counts as done.",
  "Saving a machine in herdr runs on the install screen when nothing has to be installed there; only installing or updating herdr on a machine still asks in the terminal.",
  "⇧⇥ goes back a step in setup (the footer says so now).",
  "Once setup has finished, a bare aleph opens the dashboard — even when this computer is your only machine.",
]
commits = [
  "a finished setup (quick start included) counts as a fleet: with only this computer, a bare aleph opens the dashboard instead of setup again",
  "ssh keys: every private key in ~/.ssh is found whatever it's called (not just id_ed25519 / id_ecdsa / id_rsa); setup's step 1 lists them and asks which one Aleph uses (ssh_key = [ssh] key), or makes a new one when you apply (id_ed25519 if free, else aleph_ed25519 — a key you have is never touched); key setup copies that key and, when ssh wouldn't offer it, adds its IdentityFile for the machine to ~/.ssh/config (backup kept); machines setup adds get it too",
  "setup's footer: ⇧⇥ previous step beside ⇥ next step",
  "setup knows which machines herdr has saved: herdr 0.9.5 prints machine list --json as a bare array, which setup didn't read, so every machine looked unsaved and was queued again (herdr::saved_names reads any shape); a save queued for a saved machine drops out; saving runs on the install screen when herdr there needs nothing (only an install or update asks in the terminal), and 'already exists' is saved, not failed",
]

[[entry]]
id = "2026-10-25-b"
date = "2026-10-25"
title = "Setup that installs for you, quick start, easy typing"
notes = [
  "Setup now collects everything it finds missing — herdr, a Nerd Font, terminal-notifier, an ssh key, your agents and their herdr integrations, the daemon — and installs it all at the end, on its own screen: the queue ticking along, what's running with its live output and a progress bar, a retry for anything that failed, and a celebration when it's done. Anything that needs your answer comes first, while you're there.",
  "⚡ Quick start: in setup's first step, or `aleph setup --defaults` — no questions, it installs what this computer is missing and opens Aleph. On a new computer, `./install.sh --defaults` also installs Rust and herdr if they're missing.",
  "Setup can make an ntfy topic with your own name (kept unguessable), and keeps ntfy, Slack and webhook addresses in the keychain instead of the settings file.",
  "After a usage limit, pick which agents carry on by themselves, each with its own message.",
  "Typing into an agent's pane: ctrl+q (or a click outside it) stops — no more reaching for ctrl+]. I in Fleet types straight into the selected session.",
]
commits = [
  "setup installs from a queue, on its own screen: every install found missing — herdr here, Homebrew's tools, terminal-notifier and a Nerd Font, an ssh key, agents with their herdr integrations, the daemon — is marked into the plan and runs when you apply, never on the spot; Apply is a full-screen install screen: the queue with live states and times, the running item's card (what runs, a bar from its output's percentages or a sweep, the last lines of its output), ones that need you first and waiting for enter, a summary with r to retry the failed, and a celebration — the ℵ drawn in light, sparks, what went in — before enter opens Aleph. Quick start (⚡ in step 1, aleph setup --defaults): every default, what this computer is missing queued and applied at once. The default agent offers only agents that are there or queued",
  "install.sh on a bare computer: no C linker (Xcode's command line tools), no Rust (rustup, as you) or no herdr (Homebrew, else its script) — it says so and installs each after a yes (--yes, --defaults); --defaults hands over to setup's quick start. package.sh: the zip is a fresh repository of what's committed, one commit by a neutral author",
  "setup's ntfy: a topic with your own name (your words, then 8 random hex so nobody guesses it) beside the random one; ntfy, Slack and webhook URLs go to the keystore when setup writes them — aleph.toml says secret:<key>",
  "after a usage limit: which agents carry on is a checklist (your default agent, Claude Code, Codex and the ones you have, or every agent), each with its own message — resume.<agent> ([automation.resume]), else limits.resume_prompt; other globs in limits.auto_resume are kept",
  "typing into a pane is easy to leave: ctrl+q (mux_leave = [tile] leave, any keys you like; ctrl+] still works) or a click outside the pane; I in Fleet types straight into the selected session",
]

[[entry]]
id = "2026-10-25-a"
date = "2026-10-25"
title = "Raycast setup that finishes, install commands for every agent"
notes = [
  "Setup's Raycast step no longer hangs: it builds and imports the extension, then stops by itself once Raycast has it (before, `ray develop` kept running until you pressed ctrl+c). npm's noise is gone too, and the extension's packages have no known vulnerabilities.",
  "Every agent Aleph knows has an install command now: Oh My Pi, Devin, Antigravity, Mastra Code, Kiro, Grok, Hermes, Qoder, Maki, Muse, Command Code and Prime Agent use their official installers (with Homebrew or npm as the other way where they have one).",
  "The examples in Aleph's docs and tests use neutral names — nothing personal ships with it. The Raycast extension's author is now aleph: import it once more (setup › Integrations › Raycast) and remove the old one.",
]
commits = [
  "setup's Raycast step ends by itself: ray develop never exits (it watches for edits), so it runs quietly and is stopped with ctrl+c's SIGINT a few seconds after it says it built — the extension stays in Raycast; npm's audit, funding and deprecation chatter left out (here and in install.sh). proc::stream_until. npm audit: 0 vulnerabilities — @raycast/utils 2.3, eslint 10 with @raycast/eslint-config 2.2, esbuild's install script approved",
  "agents: every one has an install command — omp, devin, agy (Antigravity), mastracode, kiro-cli, grok, hermes, qodercli, maki, muse, command-code their official installers (and Homebrew / npm / cargo alternatives where they have them), prime-agent's corrected; the tests' web-page-only agent is a stand-in now",
  "personal data out of the code, tests and docs: machine names, users, LAN addresses, home folders, project and session names, the company's product, email and name become neutral ones of the same length and shape (b31, dex42, q7x, selene, alex, ox_color_check, PhotonMix), so every test still agrees; the Raycast extension's author is aleph",
]

[[entry]]
id = "2026-10-24-q"
date = "2026-10-24"
title = "Cyberpunk's splashes, its light theme as cards, smooth splashes"
notes = [
  "Two new splashes, Cyberpunk's own. cyberdeck: a neural deck cold-booting — scanlines and glitch tears, the HUD frame tracing itself, diagnostics typing in red, your machines coming online as cyan uplinks, a big yellow sync counter that hiccups and completes, the ℵ snapping into focus out of red and cyan ghosts. neon: a city at night in the rain, your machines as neon signs stuttering on, traffic, a wet street mirroring it all, the ℵ lit as the biggest sign. The Cyberpunk themes play cyberdeck (ui.splash = theme); aleph splash neon plays the other.",
  "Cyberpunk (light) as yellow cards on black: every panel a card of the yellow, black between them and over the header and footer, titles as black tags.",
  "Splashes play on a steady 60 fps clock, so the cockpit no longer stutters.",
]
commits = [
  "cyberpunk-light as yellow cards on black: every panel a card of the yellow (ui::panel fills it), the space between them, the tab row and the strips black with yellow text, popups one more card, unfocused tags and frames near-black; splashes play on a steady 60 Hz clock (a 25 ms wait after every draw made frames uneven: the cockpit stuttered), a late frame starting the next at once",
  "splash cyberdeck: a neural interface booting, cyberpunk's own — a cursor blinking alone, the boot prompt typing; the screen powering on, a white-hot line opening into scanlines, rows torn sideways in red and cyan with static; the HUD's frame tracing itself from its cut corner in off-red, its labels typing in capitals; diagnostics typing in in red (an ICE alarm in crimson that clears, what needs you in yellow), your machines coming online as cyan readouts with their bars and sessions, a hex stream under them, a cortex trace; the yellow sync climbing in big quadrant digits, a hiccup, then complete: a flash, the brackets snapping tight, a yellow scan line sweeping down; it ends steady and live, one last glitch; with the logo the ℵ comes into focus in yellow out of its red and cyan ghosts",
  "splash neon: a rain-soaked city at night, cyberpunk's other — a skyline coming up out of a blue-violet haze, far towers pale with it, the middle ones darker, their floors lined, the near ones black against it, windows lighting in warm yellow, cyan and magenta, masts with red beacons, fog drifting across, one tower above the rest; rain setting in, thin slanted streaks quicker and brighter near, splashing on a wet street that mirrors the city, rippling, each sign's light smeared down it; your machines' names as framed neon signs in yellow, cyan, magenta and red, dark tubes until each flickers on in its own turn with a glow round it, the city's own words down towers' edges; flying traffic in lanes, white headlights and red trails, the far lanes behind the near towers; it ends steady in the rain, one sign buzzing, a letter of it dead; with the logo the city dims and the ℵ lights over it as the biggest sign of all, its tubes flickering on band by band, yellow in a crimson glow, the rain catching its light",
]

