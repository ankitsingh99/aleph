# What's new in showcase mode: notes only a build with the showcase feature
# carries, added to whats-new.toml's entry with the same id.

[[entry]]
id = "2026-10-25"
notes = [
  "Themes work in showcase mode: it shows the theme you picked (showcase.palette = cockpit brings the cockpit colours back), and a setting your profile sets is changed in that profile, so it sticks.",
]

[[entry]]
id = "2026-10-24"
notes = [
  "The autopilot tour (ctrl+t) walks the dashboard by itself, view by view, with a caption for each; any key hands it back.",
  "Story mode in the demo world: agents ask and rules answer, a machine drops and heals, a limit hits and resets, a big task finishes — through the Inbox, notifications and Raycast like the real thing. showcase.warp runs it faster.",
  "Presenter sync: Raycast and the web console follow the session and view you have open in the dashboard.",
  "Recordings become an MP4 and a GIF when you stop one (ctrl+r).",
  "A session that finishes gets its supernova; names in Monitor › Timeline are masked too.",
]
